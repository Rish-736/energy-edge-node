; Intelligent Energy Edge Node -- meter node
;
;   esp32dev-sim : simulated appliances, no hardware needed   <-- default
;   esp32dev     : real INA226 over I2C
;   native       : host-side unit tests for the ring buffer
;
; The only difference between the two ESP32 builds is -D USE_INA226_SIM.

[platformio]
default_envs = esp32dev-sim

[common]
build_flags = -Wall -Wextra

; Shared protocol code lives outside this project so gateway_node links the
; identical files -- the register map can never drift between the two.
[env]
lib_extra_dirs = ../common

[env:esp32dev-sim]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
build_flags   = ${common.build_flags} -D USE_INA226_SIM

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
build_flags   = ${common.build_flags}

; Runs the unit tests on your PC. No board, no flash cycle.
; Everything under test comes from common/ as libraries -- the ring buffer
; compiles unchanged here because its locking is a no-op off-target, so the
; code under test is the code that ships.
[env:native]
platform         = native
build_flags      = ${common.build_flags} -std=c++11 -I include
build_src_filter = -<*>
test_framework   = unity

; Runs the whole Phase 0 pipeline on your PC -- same simulator, same energy
; accumulator, same ring buffer as the firmware -- and prints the same CSV.
; Lets you generate and plot a real capture before any hardware arrives.
[env:native-sim]
platform         = native
build_flags      = ${common.build_flags} -std=c++11 -I include -D USE_INA226_SIM
; modbus_task.cpp and main.cpp are Arduino-only; sim_main.cpp replaces them.
build_src_filter = +<*> -<main.cpp> -<ina226_real.cpp> -<modbus_task.cpp>
