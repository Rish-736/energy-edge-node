# Mosquitto config for the bench setup.
#
#   mosquitto -c dashboard/mosquitto.conf
#
# Two listeners, because the gateway and the dashboard speak MQTT differently:
#
#   1883  plain MQTT     -- what the ESP32 gateway connects to
#   9001  websockets     -- what the browser connects to; a web page cannot
#                           open a raw TCP socket, so the broker has to offer
#                           MQTT wrapped in websockets for the dashboard
#
# Both carry the same messages. The broker bridges the two transports.

listener 1883
protocol mqtt

listener 9001
protocol websockets

# LOCAL BENCH ONLY.
#
# Anonymous access on an open listener is fine on a laptop behind a home
# router and completely unacceptable on anything exposed. Phase 4 adds TLS,
# real credentials and per-topic access control -- which is also where the
# IEC 62443 notes go. Do not copy this file to anything reachable.
allow_anonymous true

# Keep the broker chatty while bringing things up; drop to 'warning' later.
log_type notice
log_type warning
log_type error
connection_messages true
