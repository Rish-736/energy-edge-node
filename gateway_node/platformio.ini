; Intelligent Energy Edge Node -- gateway node ("Edge Control")
;
; Phase 1: Modbus-RTU master. Discovers meters on the RS-485 bus, polls them,
; and reports link health. Phase 2 adds MQTT; Phase 3 adds the
; demand-response controller.

[platformio]
default_envs = esp32dev

[common]
build_flags = -Wall -Wextra

; Links the SAME protocol sources as meter_node, so the register map and the
; framing code cannot drift between the two ends of the bus.
[env]
lib_extra_dirs = ../common

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
build_flags   = ${common.build_flags}
